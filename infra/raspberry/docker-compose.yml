services:
  gatus:
    image: ghcr.io/twin/gatus:stable
    container_name: guardian-gatus
    restart: unless-stopped
    ports:
      - "100.80.237.96:8080:8080"
    volumes:
      - ./config:/config:ro
      - gatus-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true

volumes:
  gatus-data:
