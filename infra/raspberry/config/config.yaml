metrics: true

storage:
  type: sqlite
  path: /data/gatus.db
  caching: true
  maximum-number-of-results: 500
  maximum-number-of-events: 100

alerting:
  ntfy:
    topic: "${GATUS_NTFY_TOPIC}"
    priority: 4
    click: "https://aerosftp.com"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: "Guardián PyME | Monitoreo"
  header: "Guardián PyME"
  dashboard-heading: "Centro de monitoreo"
  dashboard-subheading: "Clientes y servicios separados por grupo"
  default-sort-by: group

web:
  port: 8080

endpoints:
  - name: "Conectividad HTTPS"
    group: "Infraestructura"
    url: "https://www.cloudflare.com/cdn-cgi/trace"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
    alerts:
      - type: ntfy
        description: "La Raspberry perdió conectividad HTTPS."

  - name: "Motor de monitoreo"
    group: "Infraestructura"
    url: "http://127.0.0.1:8080/api/v1/endpoints/statuses"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
    alerts:
      - type: ntfy
        description: "El motor local de monitoreo no responde."

  - name: "Sitio comercial público"
    group: "Guardián PyME"
    url: "https://aerosftp.com"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
      - "[BODY] == pat(*Guardián PyME*)"
    alerts:
      - type: ntfy
        description: "El sitio comercial no responde o no entrega el contenido esperado."

  - name: "Dominio y certificado"
    group: "Guardián PyME"
    url: "https://aerosftp.com"
    interval: 6h
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
      - "[DOMAIN_EXPIRATION] > 720h"
    alerts:
      - type: ntfy
        failure-threshold: 1
        success-threshold: 1
        minimum-reminder-interval: 24h
        description: "El dominio o certificado requiere atención."
