services:
  gatus:
    image: ghcr.io/twin/gatus:stable
    container_name: guardian-gatus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/config:ro
      - gatus-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    environment:
      GATUS_NTFY_TOPIC: ${GATUS_NTFY_TOPIC:-guardian-alerts-not-configured}

volumes:
  gatus-data:
